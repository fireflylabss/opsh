name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: opsh
      - uses: actions/checkout@v4
        with:
          repository: fireflylabss/optionSDK
          path: optionSDK
          ref: v0.1.3
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
        working-directory: opsh
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: opsh
      - name: Test
        run: cargo test
        working-directory: opsh
      - name: Release build
        run: cargo build --release
        working-directory: opsh

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
