name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g. v0.1.5)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.name }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  aur:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Bump PKGBUILD + .SRCINFO
        run: |
          chmod +x packaging/aur/bump.sh
          ./packaging/aur/bump.sh "${{ needs.resolve.outputs.tag }}"

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: opsh
          pkgbuild: ./packaging/aur/PKGBUILD
          commit_username: horizzon3507
          commit_email: horizzon3507@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ needs.resolve.outputs.version }}

      - name: Open PR with packaging bump
        uses: peter-evans/create-pull-request@v8
        with:
          base: main
          branch: chore/aur-bump-${{ needs.resolve.outputs.version }}
          add-paths: |
            packaging/aur/PKGBUILD
            packaging/aur/.SRCINFO
          commit-message: "chore(aur): bump to ${{ needs.resolve.outputs.version }}"
          title: "chore(aur): bump packaging to ${{ needs.resolve.outputs.version }}"
          body: |
            Automated by the `release` workflow for tag `${{ needs.resolve.outputs.tag }}`.
            The AUR package has already been published; this PR syncs
            `packaging/aur/PKGBUILD` and `.SRCINFO` on `main`.
            No-op (no PR) if `main` already carries this bump.
          delete-branch: true

  crates-io:
    needs: resolve
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          path: opsh

      - uses: actions/checkout@v7
        with:
          repository: fireflylabss/optionSDK
          path: optionSDK
          ref: v0.1.3

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        working-directory: opsh
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "Missing secret CARGO_REGISTRY_TOKEN" >&2
            exit 1
          fi
          set +e
          output="$(cargo publish --locked 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if printf '%s\n' "$output" | grep -qi 'already exists'; then
            echo "Version already on crates.io — treating as success"
            exit 0
          fi
          exit "$status"
